    <div class="portal-content">

            <span><i class="lg lg-open"></i> Open</span>

            <div class="portal-section-head"><h2>Stages</h2></div>
            <div class="portal-table-wrap" style="padding:16px;">

            </div>
        </div>
        <div class="portal-section">
            <div class="portal-section-head"><h2>Tasks</h2></div>

            </div>

    </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    // Parse YYYY-MM-DD as a plain calendar day (no timezone drift).
    function dateToDay(d) {
      const [y, m, dd] = String(d).slice(0, 10).split('-').map(Number);
      return Math.round(Date.UTC(y, m - 1, dd) / 86400000);
    }
    function dayToLabel(day) {
      return new Date(day * 86400000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    }

    function renderGanttRows(container, items, rangeStart, rangeEnd, emptyText) {
      if (!items.length) {
        container.innerHTML = `<p class="portal-note">${emptyText}</p>`;
        return;
      }
      const span = Math.max(rangeEnd - rangeStart, 1);
      const pctOf = (day) => Math.min(100, Math.max(0, ((day - rangeStart) / span) * 100));
      const today = dateToDay(todayISO());
      const todayPct = pctOf(today);

      // Date labels along the top — about 6-8 evenly spaced ticks.
      const steps = [1, 2, 3, 5, 7, 14, 30, 60, 90];
      const step = steps.find(n => span / n <= 8) || 90;
      let ticks = '';
      for (let d = rangeStart; d <= rangeEnd; d += step) {
        ticks += `<span class="gantt-tick" style="left:${pctOf(d)}%;">${dayToLabel(d)}</span>`;
      }

      const rows = items.map(it => {
        const day = dateToDay(it.due_date);
        const pct = pctOf(day);
        const cls = it.status === 'done' ? 'is-done' : (today > day ? 'is-overdue' : '');
        const labelSide = pct > 85 ? 'is-left' : '';
        return `
          <div class="gantt-row">
            <div class="gantt-label" title="${escapeHtml(it.label)}">${escapeHtml(it.label)}</div>
            <div class="gantt-track">
              <div class="gantt-today" style="left:${todayPct}%;"></div>
              <div class="gantt-bar ${cls}" style="left:calc(${pct}% - 5px);" title="${escapeHtml(it.label)} — due ${it.due_date}"></div>
              <span class="gantt-date ${labelSide}" style="left:calc(${pct}% ${pct > 85 ? '- ' : '+ '}16px);">${dayToLabel(day)}</span>
            </div>
          </div>`;
      }).join('');

      container.innerHTML = `
        <div class="gantt-header"><div class="gantt-label"></div><div class="gantt-axis">${ticks}</div></div>
        ${rows}`;
    }

    async function loadGantt() {
      const projectId = document.getElementById('projectSelect').value;
      if (!projectId) return;

      const { data: stages } = await supabaseClient.from('project_stages').select('*').eq('project_id', projectId).order('position');
      const { data: tasks } = await supabaseClient.from('tasks').select('*').eq('project_id', projectId).not('due_date', 'is', null);

      const stageItems = (stages || []).filter(s => s.due_date).map(s => ({ label: s.name, due_date: s.due_date, status: s.status }));
      const taskItems = (tasks || []).map(t => ({ label: t.title, due_date: t.due_date, status: t.status }));

      const allDates = [...stageItems, ...taskItems].map(i => dateToDay(i.due_date));
      const today = dateToDay(todayISO());
      const rangeStart = allDates.length ? Math.min(today, ...allDates) - 2 : today - 2;
      const rangeEnd = allDates.length ? Math.max(today, ...allDates) + 2 : today + 30;

      renderGanttRows(document.getElementById('ganttStages'), stageItems, rangeStart, rangeEnd, 'No stage in this project has a target date yet. Add one from the project page (the date field next to "Add Stage").');
      renderGanttRows(document.getElementById('ganttTasks'), taskItems, rangeStart, rangeEnd, 'No task in this project has a due date yet.');
    }

    async function loadProjects() {
      const { data: projects } = await supabaseClient.from('projects').select('id, name').order('name');
      const sel = document.getElementById('projectSelect');
      sel.innerHTML = `<option value="">Select a project...</option>` + (projects || []).map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
      if (projects && projects.length) { sel.value = projects[0].id; loadGantt(); }
    }

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      const { profile } = auth;
      document.getElementById('userAvatar').textContent = initials(profile.name);
      document.getElementById('userName').textContent = profile.name;

      if (!isAdmin(profile)) { window.location.href = 'dashboard.html'; return; }

      loadProjects();
    })();
</script>
</body>
