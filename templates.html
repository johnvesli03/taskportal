<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates — Euodoo Task Portal</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/portal.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body{padding:24px;}</style>
</head>
<body class="portal-page">
<script>try{if(localStorage.getItem('euodoo-dark-mode')==='1')document.body.classList.add('dark-mode');if(localStorage.getItem('euodoo-sidebar-collapsed')==='1')document.body.classList.add('sidebar-collapsed');}catch(e){}</script>


<div class="portal-shell">
    <aside class="portal-sidebar">
        <div class="sidebar-brand-row" style="display:flex;align-items:center;gap:8px;padding:10px 8px 16px;">
            <img src="assets/logo-mark.png" alt="Euodoo" style="height:26px;" onerror="this.style.display='none'">
            <span class="sidebar-brand-label" style="color:#f1f2f8;font-weight:700;font-size:.85rem;">Task Portal</span>
        </div>
        <nav>
            <a class="portal-nav-item" href="dashboard.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Dashboard</a>
            <a class="portal-nav-item" href="projects.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span> Projects</a>
            <a class="portal-nav-item" href="tasks.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span> My Tasks</a>
            <a class="portal-nav-item" href="kanban.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg></span> Kanban</a>
            <a class="portal-nav-item" href="week.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> My Week</a>
            <a class="portal-nav-item" id="teamLink" href="team.html" data-admin-only="1" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Team</a>
            <a class="portal-nav-item" id="workloadLink" href="workload.html" data-admin-only="1" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Workload</a>
            <a class="portal-nav-item" id="ganttLink" href="gantt.html" data-admin-only="1" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/></svg></span> Gantt</a>
            <a class="portal-nav-item active" id="templatesLink" href="templates.html" data-admin-only="1" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></span> Templates</a>
        </nav>
        <div class="portal-sidebar-footer">
            <div class="portal-who portal-clickable" onclick="openAccountModal()">
                <div class="portal-who-avatar" id="userAvatar">--</div>
                <div class="portal-who-text">
                    <b id="userName">Loading...</b>
                    <span id="who-designation">—</span>
                </div>
            </div>
        </div>
    </aside>

    <div class="portal-content">
        <div class="portal-topline">
            <div>
                <div class="portal-page-title">Task Templates</div>
                <div class="portal-page-sub">Reusable checklists — e.g. "New client onboarding" — that anyone can apply when creating a task.</div>
            </div>
            <button class="btn btn-primary" onclick="openTemplateModal()">+ New Template</button>
        </div>
        <div id="templateList"><p class="portal-note">Loading templates...</p></div>
    </div>
</div>

<div class="premium-modal" id="templateModal">
    <div class="premium-modal__backdrop" onclick="closeTemplateModal()"></div>
    <div class="premium-modal__dialog">
        <button class="premium-modal__close" onclick="closeTemplateModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        <div class="section-tag">New Template</div>
        <h3>Build a Task Template</h3>
        <div class="portal-field">
            <label>Template Name</label>
            <input type="text" class="input-box" id="tplName" placeholder="e.g. New Client Onboarding">
        </div>
        <div class="portal-field">
            <label>Description</label>
            <textarea class="input-box" id="tplDesc" rows="2"></textarea>
        </div>
        <div class="portal-field">
            <label>Default Priority</label>
            <select class="input-box" id="tplPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
            </select>
        </div>
        <div class="portal-field">
            <label>Checklist Items</label>
            <div id="tplItems"></div>
            <button class="btn btn-secondary" style="margin-top:6px;" onclick="addTemplateItemField()">+ Add Item</button>
        </div>
        <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:10px;" onclick="saveTemplate()">Save Template</button>
    </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    function addTemplateItemField(value) {
      const wrap = document.getElementById('tplItems');
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; gap:6px; margin-bottom:6px;';
      row.innerHTML = `<input type="text" class="input-box tpl-item-input" value="${escapeHtml(value || '')}" placeholder="Checklist item..."><button class="btn btn-secondary" style="padding:8px 10px;" onclick="this.parentElement.remove()">${icon('x', 12)}</button>`;
      wrap.appendChild(row);
    }

    function openTemplateModal() {
      document.getElementById('tplName').value = '';
      document.getElementById('tplDesc').value = '';
      document.getElementById('tplPriority').value = 'medium';
      document.getElementById('tplItems').innerHTML = '';
      addTemplateItemField();
      document.getElementById('templateModal').classList.add('is-open');
    }
    function closeTemplateModal() { document.getElementById('templateModal').classList.remove('is-open'); }

    async function saveTemplate() {
      const name = document.getElementById('tplName').value.trim();
      if (!name) { showToast('error', 'Name required', 'Please name this template.'); return; }
      const items = Array.from(document.querySelectorAll('.tpl-item-input')).map(i => i.value.trim()).filter(Boolean);

      const { data: tpl, error } = await supabaseClient.from('task_templates').insert({
        name,
        description: document.getElementById('tplDesc').value.trim() || null,
        default_priority: document.getElementById('tplPriority').value,
        created_by: window.__currentProfile.id
      }).select().single();
      if (error) { showToast('error', 'Could not save', error.message); return; }

      if (items.length) {
        await supabaseClient.from('task_template_items').insert(items.map((title, i) => ({ template_id: tpl.id, title, position: i })));
      }
      showToast('success', 'Template saved', `"${name}" is ready to use.`);
      closeTemplateModal();
      loadTemplates();
    }

    async function deleteTemplate(id, name) {
      if (!(await customConfirm(`Delete template "${name}"? This cannot be undone.`, { title: 'Delete template', confirmText: 'Delete', danger: true }))) return;
      await supabaseClient.from('task_templates').delete().eq('id', id);
      loadTemplates();
    }

    async function loadTemplates() {
      const { data: templates } = await supabaseClient.from('task_templates').select('*, task_template_items(*)').order('created_at', { ascending: false });
      const list = document.getElementById('templateList');
      if (!templates || !templates.length) { list.innerHTML = `<p class="portal-note">No templates yet — create one to speed up repeat work like client onboarding.</p>`; return; }
      list.innerHTML = templates.map(t => `
        <div class="template-card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <b style="font-size:.95rem;">${escapeHtml(t.name)}</b>
              <span class="${priorityPillClass(t.default_priority)}" style="margin-left:8px;">${t.default_priority}</span>
              ${t.description ? `<p class="portal-note" style="margin-top:4px;">${escapeHtml(t.description)}</p>` : ''}
            </div>
            <button class="btn btn-secondary" style="padding:6px 10px; font-size:12px;" onclick="deleteTemplate('${t.id}', '${escapeHtml(t.name)}')">${icon('x',12)} Delete</button>
          </div>
          <div style="margin-top:10px;">
            ${(t.task_template_items || []).sort((a,b)=>a.position-b.position).map(i => `<div class="template-item-row">${icon('check',12)} ${escapeHtml(i.title)}</div>`).join('') || '<span class="portal-note">No checklist items.</span>'}
          </div>
        </div>
      `).join('');
    }

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      const { profile } = auth;
      document.getElementById('userAvatar').textContent = initials(profile.name);
      document.getElementById('userName').textContent = profile.name;

      if (!isAdmin(profile)) { window.location.href = 'dashboard.html'; return; }

      loadTemplates();
    })();
</script>
</body>
</html>
