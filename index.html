<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Euodoo Task Portal — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --brand-orange: #F06422;
      --brand-orange-dark: #c8500f;
      --brand-orange-tint: #fdece1;
    }
    body {
      margin: 0; min-height: 100vh; background: #f4f4f8;
      font-family: var(--font-body);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%; max-width: 460px;
      background: #fff; border-radius: 24px;
      border: 1px solid #ececf3;
      box-shadow: 0 18px 44px rgba(15,23,42,.07);
      padding: 40px 40px 32px;
    }
    .auth-logo-row { display: flex; justify-content: center; margin-bottom: 18px; }
    .auth-logo-row img { height: 34px; }
    .auth-badge {
      display: inline-flex; align-items: center;
      background: var(--brand-orange-tint); color: var(--brand-orange-dark);
      font-size: 11.5px; font-weight: 700; letter-spacing: .06em;
      padding: 7px 16px; border-radius: 999px; margin-bottom: 22px;
    }
    .auth-card h1 { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; color: #0f172a; margin: 0 0 8px; line-height: 1.25; }
    .auth-card p.auth-sub { color: #64748b; font-size: .92rem; line-height: 1.5; margin: 0 0 26px; }
    .auth-field { margin-bottom: 18px; }
    .auth-field label { display: block; font-size: .84rem; font-weight: 600; color: #1e293b; margin-bottom: 7px; }
    .auth-field input {
      width: 100%; box-sizing: border-box; padding: 13px 15px; font-size: .92rem;
      background: #f8f9fb; border: 1px solid #e5e7eb; border-radius: 12px; color: #0f172a;
      font-family: var(--font-body);
    }
    .auth-field input:focus { outline: none; border-color: var(--brand-orange); background: #fff; }
    .auth-forgot { text-align: right; margin-top: 8px; }
    .auth-forgot a, .auth-forgot-center a { font-size: .82rem; color: #94a3b8; text-decoration: none; }
    .auth-forgot a:hover, .auth-forgot-center a:hover { color: var(--brand-orange); }
    .auth-submit {
      width: 100%; padding: 15px; margin-top: 4px;
      background: var(--brand-orange); color: #fff; border: none; border-radius: 14px;
      font-size: .95rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 10px 24px rgba(234,88,12,.28);
      transition: filter .15s;
    }
    .auth-submit:hover { filter: brightness(1.05); }
    .auth-forgot-center { text-align: center; margin-top: 16px; }
    .auth-divider { border: none; border-top: 1px solid #eef0f4; margin: 24px 0 18px; }
    .auth-hint { text-align: center; font-size: .87rem; color: #64748b; }
    .auth-hint a { color: var(--brand-orange); font-weight: 700; text-decoration: none; }
    .auth-note { text-align: center; font-size: .78rem; color: #94a3b8; margin-top: 14px; line-height: 1.5; }
    .auth-error {
      display: none; font-size: .82rem; padding: 11px 14px; border-radius: 10px;
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo-row">
    <img src="assets/logo.png" alt="Euodoo Technologies" style="height:56px;" onerror="this.style.display='none'">
  </div>
  <div style="text-align:center;">
    <span class="auth-badge">TASK PORTAL</span>
  </div>

  <h1 id="formTitle">Sign in to your workspace</h1>
  <p class="auth-sub">Log project and task updates, track progress, and keep a full history for your team.</p>

  <div class="auth-error" id="authError"></div>

  <form id="authForm">
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@euodootech.com" required>
    </div>
    <div class="auth-field">
      <label>Employee ID</label>
      <input type="text" id="employeeId" placeholder="e.g. ET003" required autocapitalize="characters">
    </div>
    <div class="auth-field" id="passwordField">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" required minlength="6">
      <div class="auth-forgot"><a href="#" id="forgotLink">Forgot your password?</a></div>
    </div>
    <button type="submit" class="auth-submit" id="submitBtn">Sign In</button>
  </form>

  <form id="forgotForm" style="display:none;">
    <div class="auth-field">
      <label>Employee ID</label>
      <input type="text" id="forgotEmployeeId" placeholder="e.g. ET003" required autocapitalize="characters">
    </div>
    <button type="submit" class="auth-submit">Send Reset Link</button>
  </form>

  <hr class="auth-divider">

  <p class="auth-note">New here? Please contact your administrator to have an account created for you, along with your Employee ID and sign-in credentials.</p>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  const form = document.getElementById('authForm');
  const forgotForm = document.getElementById('forgotForm');
  const formTitle = document.getElementById('formTitle');
  const submitBtn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('authError');
  const forgotLink = document.getElementById('forgotLink');

  forgotLink.addEventListener('click', (e) => {
    e.preventDefault();
    form.style.display = 'none';
    forgotForm.style.display = 'block';
    document.querySelector('.auth-note').style.display = 'none';
    formTitle.textContent = 'Reset your password';
    errorBox.style.display = 'none';
  });

  // Generic error for both bad ID and bad password — never reveal
  // which one was wrong (same reasoning as a normal email+password form).
  const BAD_LOGIN = 'That Employee ID or password is incorrect.';

  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const employeeId = document.getElementById('forgotEmployeeId').value.trim();
    const btn = forgotForm.querySelector('button');
    btn.textContent = 'Sending...';
    try {
      const { data: email, error: resolveErr } = await supabaseClient.rpc('resolve_employee_login', { p_employee_id: employeeId });
      if (resolveErr || !email) throw new Error('No account found for that Employee ID.');
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}${window.location.pathname.replace('index.html', '')}reset-password.html`
      });
      if (error) throw error;
      forgotForm.innerHTML = `<div class="auth-field"><p style="font-size:.86rem; color:#166534; background:#f0fdf4; border:1px solid #bbf7d0; padding:12px 14px; border-radius:10px;">A reset link has been sent to the email on file for this account. Check your inbox.</p></div>`;
    } catch (err) {
      errorBox.style.display = 'block';
      errorBox.textContent = err.message || 'Could not send reset email.';
      btn.textContent = 'Send Reset Link';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.textContent = 'Please wait...';

    const email = document.getElementById('email').value.trim();
    const employeeId = document.getElementById('employeeId').value.trim();
    const password = document.getElementById('password').value;

    try {
      // The Employee ID must belong to the SAME account as the email typed
      // in — resolve it server-side and compare, rather than trusting the
      // form. Mismatch gets the same generic error as a wrong password.
      const { data: resolvedEmail, error: resolveErr } = await supabaseClient.rpc('resolve_employee_login', { p_employee_id: employeeId });
      if (resolveErr || !resolvedEmail || resolvedEmail.toLowerCase() !== email.toLowerCase()) throw new Error(BAD_LOGIN);

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw new Error(BAD_LOGIN);

      queueToast('success', 'Signed in', `Welcome back!`, { sound: true });
      window.location.href = 'dashboard.html';
    } catch (err) {
      const message = err.message || 'Something went wrong. Please try again.';
      errorBox.style.display = 'block';
      errorBox.textContent = message;
      showToast('error', 'Sign in failed', message, { sound: true });
      submitBtn.textContent = 'Sign In';
    }
  });

  (async () => {
    flushPendingToast();
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = 'dashboard.html';
  })();
</script>
</body>
</html>
