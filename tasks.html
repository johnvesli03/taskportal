<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — Euodoo Task Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>body{padding:24px;}</style>
</head>
<body class="portal-page">
<script>try{if(localStorage.getItem('euodoo-dark-mode')==='1')document.body.classList.add('dark-mode');if(localStorage.getItem('euodoo-sidebar-collapsed')==='1')document.body.classList.add('sidebar-collapsed');}catch(e){}</script>


<div class="portal-shell">
  <aside class="portal-sidebar">
    <div class="sidebar-brand-row" style="display:flex;align-items:center;gap:8px;padding:10px 8px 16px;">
      <img src="assets/logo-mark.png" alt="Euodoo" style="height:26px;" onerror="this.style.display='none'">
      <span class="sidebar-brand-label" style="color:#f1f2f8;font-weight:700;font-size:.85rem;">Task Portal</span>
    </div>
    <nav>
      <a class="portal-nav-item" href="dashboard.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Dashboard</a>
      <a class="portal-nav-item" href="projects.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span> Projects</a>
      <a class="portal-nav-item active" href="tasks.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span> My Tasks</a>
      <a class="portal-nav-item" href="kanban.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg></span> Kanban</a>
      <a class="portal-nav-item" href="week.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> My Week</a>
      <a class="portal-nav-item" id="teamLink" href="team.html" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Team</a>
      <a class="portal-nav-item" id="workloadLink" href="workload.html" data-admin-only="1" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Workload</a>
      <a class="portal-nav-item" id="ganttLink" href="gantt.html" data-admin-only="1" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/></svg></span> Gantt</a>
      <a class="portal-nav-item" id="templatesLink" href="templates.html" data-admin-only="1" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></span> Templates</a>
    </nav>
    <div class="portal-sidebar-footer">
      <div class="portal-who portal-clickable" onclick="openAccountModal()">
        <div class="portal-who-avatar" id="userAvatar">--</div>
        <div class="portal-who-text">
          <b id="userName">Loading...</b>
          <span id="who-designation">—</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="portal-content">
    <div class="portal-topline">
      <div>
        <div class="portal-page-title" id="pageTitle">My Tasks</div>
        <div class="portal-page-sub">Standalone tasks and everything assigned to you.</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary" onclick="exportTasksCSV()">Export CSV</button>
        <button class="btn btn-primary" id="newTaskBtn" data-admin-only="1" style="display:none;" onclick="openModal()">+ New Standalone Task</button>
      </div>
    </div>

    <div class="portal-field" style="max-width:340px; position:relative;">
      <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-muted); pointer-events:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input type="text" class="input-box" id="searchBox" placeholder="Search tasks by title..." style="padding-left:34px;">
    </div>

    <div class="portal-toggle-row" id="statusFilter">
      <span class="portal-toggle-btn active" data-status="all">All</span>
      <span class="portal-toggle-btn" data-status="todo">To Do</span>
      <span class="portal-toggle-btn" data-status="in_progress">In Progress</span>
      <span class="portal-toggle-btn" data-status="blocked">Blocked</span>
      <span class="portal-toggle-btn" data-status="review">Review</span>
      <span class="portal-toggle-btn" data-status="pending_approval">Pending Approval</span>
      <span class="portal-toggle-btn" data-status="done">Done</span>
    </div>

    <div class="bulk-bar" id="bulkBar" style="display:none;">
      <span id="bulkCount" style="font-size:.82rem; font-weight:600; color:var(--primary-dark);"></span>
      <select id="bulkAssignee" class="input-box" data-admin-only="1" style="display:none; max-width:200px; padding:6px 10px;"><option value="">Reassign to...</option></select>
      <button class="btn btn-secondary" id="bulkReassignBtn" data-admin-only="1" style="display:none; padding:6px 12px; font-size:12.5px;" onclick="bulkReassign()">Apply Reassign</button>
      <button class="btn btn-secondary" style="padding:6px 12px; font-size:12.5px;" onclick="bulkMarkDone()">Mark Done</button>
      <button class="btn btn-secondary" style="padding:6px 12px; font-size:12.5px;" onclick="clearSelection()">Clear</button>
    </div>

    <div class="portal-table-wrap" style="padding:6px;">
      <div id="tasksList" style="padding:10px;"><p class="portal-note">Loading tasks...</p></div>
    </div>
  </div>
</div>

<div class="premium-modal" id="modalBackdrop">
  <div class="premium-modal__backdrop" onclick="closeModal()"></div>
  <div class="premium-modal__dialog">
    <button class="premium-modal__close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <div class="section-tag">New Task</div>
    <h3>New Standalone Task</h3>
    <form id="taskForm">
      <div class="portal-field">
        <label>Task Title</label>
        <input type="text" class="input-box" id="tTitle" required placeholder="e.g. Renew SSL certificate">
      </div>
      <div class="portal-field">
        <label>Description</label>
        <textarea id="tDesc" placeholder="Details..."></textarea>
      </div>
      <div class="field-row">
        <div class="portal-field">
          <label>Priority</label>
          <select id="tPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <div class="portal-field">
          <label>Due Date</label>
          <input type="date" class="input-box" id="tDue">
        </div>
      </div>
      <div class="field-row">
        <div class="portal-field">
          <label>Estimated Hours <span class="portal-note">(optional)</span></label>
          <input type="number" class="input-box" id="tEstHours" min="0" step="0.5" placeholder="e.g. 6">
        </div>
        <div class="portal-field">
          <label>Assign To</label>
          <select id="tAssignee"><option value="">Unassigned</option></select>
        </div>
      </div>
      <div class="portal-field">
        <label>Repeats <span class="portal-note">(auto-creates the next one when this is marked done)</span></label>
        <select id="tRecurrence">
          <option value="none" selected>Does not repeat</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>
      <div class="premium-modal__actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Task</button>
      </div>
    </form>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  let currentProfile = null;
  let allTasks = [];
  let activeFilter = 'all';
  let searchTerm = '';
  let selectedIds = new Set();

  function openModal() { document.getElementById('modalBackdrop').classList.add('is-open'); }
  function closeModal() { document.getElementById('modalBackdrop').classList.remove('is-open'); }

  function toggleSelect(id, checked) {
    if (checked) selectedIds.add(id); else selectedIds.delete(id);
    updateBulkBar();
  }
  function clearSelection() { selectedIds.clear(); updateBulkBar(); renderTasks(); }
  function updateBulkBar() {
    const bar = document.getElementById('bulkBar');
    bar.style.display = selectedIds.size > 0 ? 'flex' : 'none';
    document.getElementById('bulkCount').textContent = `${selectedIds.size} selected`;
  }

  async function bulkReassign() {
    if (!isAdmin(currentProfile)) { await customAlert('Only an admin can reassign tasks.', { title: 'Not allowed' }); return; }
    const to = document.getElementById('bulkAssignee').value;
    if (!to) { await customAlert('Pick someone to reassign to first.', { title: 'Nothing selected' }); return; }
    for (const id of selectedIds) {
      await supabaseClient.from('tasks').update({ assigned_to: to }).eq('id', id);
    }
    showToast('success', 'Reassigned', `${selectedIds.size} task(s) reassigned.`);
    clearSelection();
    loadTasks();
  }

  async function bulkMarkDone() {
    if (!(await customConfirm(`Mark ${selectedIds.size} task(s) as Done?`, { confirmText: 'Mark Done' }))) return;
    for (const id of selectedIds) {
      await supabaseClient.from('tasks').update({ status: 'done' }).eq('id', id);
      await supabaseClient.from('task_updates').insert({
        task_id: id, user_id: currentProfile.id, kind: 'update',
        update_text: 'Marked done via bulk action', new_status: 'done'
      });
    }
    showToast('success', 'Updated', `${selectedIds.size} task(s) marked done.`);
    clearSelection();
    loadTasks();
  }

  function renderTasks() {
    const list = document.getElementById('tasksList');
    let filtered = activeFilter === 'all' ? allTasks : allTasks.filter(t => t.status === activeFilter);
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      filtered = filtered.filter(t => t.title.toLowerCase().includes(q) || (t.project && t.project.name.toLowerCase().includes(q)));
    }

    if (filtered.length === 0) {
      list.innerHTML = `<div class="portal-empty-state"><h3>Nothing here</h3><p>Try a different filter or search, or create a standalone task.</p></div>`;
      return;
    }

    list.innerHTML = `<table class="portal-table"><tbody>` + filtered.map(t => `
      <tr>
        <td style="width:1%;" onclick="event.stopPropagation()">
          <input type="checkbox" ${selectedIds.has(t.id) ? 'checked' : ''} onchange="toggleSelect('${t.id}', this.checked)">
        </td>
        <td class="portal-clickable" onclick="window.location='task.html?id=${t.id}'">
          <div class="portal-cell-stack">
            <b style="font-size:.88rem;">${escapeHtml(t.title)}</b>
            <small>
              ${t.project ? icon('folder', 11) + ' ' + escapeHtml(t.project.name) : icon('dot', 8) + ' Standalone'}
              ${t.assignee ? ' · ' + escapeHtml(t.assignee.name) : ' · Unassigned'}
              ${t.due_date ? ' · ' + dueDateLabel(t.due_date, t.status) : ''}
            </small>
          </div>
        </td>
        <td style="text-align:right; white-space:nowrap;" class="portal-clickable" onclick="window.location='task.html?id=${t.id}'">
          <span class="status-pill ${priorityPillClassUrgent(t.priority, t.due_date, t.status)}">${t.priority}</span>
          <span class="status-pill ${statusPillClass(t.status)}">${statusLabel(t.status)}</span>
        </td>
      </tr>
    `).join('') + `</tbody></table>`;
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    searchTerm = e.target.value.trim();
    renderTasks();
  });

  document.getElementById('statusFilter').addEventListener('click', (e) => {
    if (!e.target.classList.contains('portal-toggle-btn')) return;
    document.querySelectorAll('.portal-toggle-btn').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    activeFilter = e.target.dataset.status;
    renderTasks();
  });

  async function loadTeamIntoSelect() {
    const { data: people } = await supabaseClient.from('profiles').select('id, name').order('name');
    const select = document.getElementById('tAssignee');
    const bulkSelect = document.getElementById('bulkAssignee');
    (people || []).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.name;
      if (p.id === currentProfile.id) opt.selected = true;
      select.appendChild(opt);

      const opt2 = document.createElement('option');
      opt2.value = p.id; opt2.textContent = p.name;
      bulkSelect.appendChild(opt2);
    });
  }

  document.getElementById('taskForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { data: newTask, error } = await supabaseClient.from('tasks').insert({
      project_id: null,
      title: document.getElementById('tTitle').value.trim(),
      description: document.getElementById('tDesc').value.trim(),
      priority: document.getElementById('tPriority').value,
      due_date: document.getElementById('tDue').value || null,
      estimated_hours: document.getElementById('tEstHours').value || null,
      assigned_to: document.getElementById('tAssignee').value || currentProfile.id,
      recurrence: document.getElementById('tRecurrence').value,
      created_by: currentProfile.id
    }).select().single();

    if (error) { await customAlert('Could not create task: ' + error.message, { title: 'Something went wrong', danger: true }); return; }

    await supabaseClient.from('task_updates').insert({
      task_id: newTask.id, user_id: currentProfile.id,
      update_text: 'Task created', old_status: null, new_status: 'todo', is_system: true
    });
    notifyWebhook(`:new: New task created: *${newTask.title}*`);

    closeModal();
    document.getElementById('taskForm').reset();
    loadTasks();
  });

  async function loadTasks() {
    let query = supabaseClient
      .from('tasks')
      .select('*, project:projects(name), assignee:profiles!tasks_assigned_to_fkey(name)')
      .order('created_at', { ascending: false });

    if (!isAdmin(currentProfile)) {
      query = query.or(`assigned_to.eq.${currentProfile.id},created_by.eq.${currentProfile.id}`);
    }

    const { data: tasks, error } = await query;
    if (error) { document.getElementById('tasksList').innerHTML = `<p class="portal-note">Could not load tasks.</p>`; return; }
    allTasks = tasks || [];
    renderTasks();
  }

  function exportTasksCSV() {
    exportCSV('tasks.csv', allTasks.map(t => ({
      title: t.title, status: t.status, priority: t.priority,
      project: t.project?.name || '', assignee: t.assignee?.name || '',
      due_date: t.due_date || '', estimated_hours: t.estimated_hours || ''
    })));
  }

  (async () => {
    const auth = await requireAuth();
    if (!auth) return;
    currentProfile = auth.profile;

    document.getElementById('tDue').min = todayISO();

    document.getElementById('userAvatar').textContent = initials(currentProfile.name);
    document.getElementById('userName').textContent = currentProfile.name;
    if (isAdmin(currentProfile)) {
      document.getElementById('teamLink').style.display = 'flex';
      document.getElementById('pageTitle').textContent = 'All Tasks';
    }

    loadTeamIntoSelect();
    loadTasks();
  })();
</script>
</body>
</html>
