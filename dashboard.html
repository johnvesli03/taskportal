<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Euodoo Task Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>body{padding:24px;}</style>
</head>
<body class="portal-page">
<script>try{if(localStorage.getItem('euodoo-dark-mode')==='1')document.body.classList.add('dark-mode');if(localStorage.getItem('euodoo-sidebar-collapsed')==='1')document.body.classList.add('sidebar-collapsed');}catch(e){}</script>


<div class="portal-shell">
  <aside class="portal-sidebar">
    <div class="sidebar-brand-row" style="display:flex;align-items:center;gap:8px;padding:10px 8px 16px;">
      <img src="assets/logo-mark.png" alt="Euodoo" style="height:26px;" onerror="this.style.display='none'">
      <span class="sidebar-brand-label" style="color:#f1f2f8;font-weight:700;font-size:.85rem;">Task Portal</span>
    </div>
    <nav>
      <a class="portal-nav-item active" href="dashboard.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Dashboard</a>
      <a class="portal-nav-item" href="projects.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span> Projects</a>
      <a class="portal-nav-item" href="tasks.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span> My Tasks</a>
      <a class="portal-nav-item" href="kanban.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg></span> Kanban</a>
      <a class="portal-nav-item" href="week.html"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> My Week</a>
      <a class="portal-nav-item" id="teamLink" href="team.html" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Team</a>
      <a class="portal-nav-item" id="workloadLink" href="workload.html" data-admin-only="1" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Workload</a>
      <a class="portal-nav-item" id="ganttLink" href="gantt.html" data-admin-only="1" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/></svg></span> Gantt</a>
      <a class="portal-nav-item" id="templatesLink" href="templates.html" data-admin-only="1" style="display:none;"><span class="portal-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></span> Templates</a>
    </nav>
    <div class="portal-sidebar-footer">
      <div class="portal-who portal-clickable" onclick="openAccountModal()">
        <div class="portal-who-avatar" id="userAvatar">--</div>
        <div class="portal-who-text">
          <b id="userName">Loading...</b>
          <span id="who-designation">—</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="portal-content">
    <div class="portal-topline">
      <div>
        <div class="portal-page-title" id="greeting">Welcome back</div>
        <div class="portal-page-sub">Here's what's happening across your work today.</div>
      </div>
    </div>

    <div class="portal-stats-grid" id="statCards"></div>

    <div id="adminPanels" style="display:none;">
      <div class="portal-section">
        <div class="portal-section-head"><h2>Waiting for your decision <span class="portal-note" id="extCount" style="font-weight:400;"></span></h2></div>
        <div id="extList"></div>
      </div>
      <div class="portal-section">
        <div class="portal-section-head"><h2>Working now</h2></div>
        <div id="workingNow"></div>
      </div>
    </div>

    <div class="portal-section">
      <div class="portal-section-head"><h2>Recent Updates</h2></div>
      <div class="portal-table-wrap" style="padding:14px;">
        <div id="activityFeed"><p class="portal-note">Loading activity...</p></div>
      </div>
    </div>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  async function loadAdminPanels() {
    const wrap = document.getElementById('adminPanels'); if (!wrap) return;
    const dmyD = (d) => { const [y, m, dd] = String(d).slice(0, 10).split('-'); return `${dd}-${m}-${y}`; };
    const [ext, tm] = await Promise.all([
      supabaseClient.from('due_extension_requests').select('id, task_id, old_due, new_due, reason, created_at, who:profiles!due_extension_requests_requested_by_fkey(name), tasks(title)').eq('status', 'pending').order('created_at'),
      supabaseClient.from('task_timers').select('started_at, task_id, who:profiles!task_timers_user_id_fkey(name), tasks(title)').gte('last_seen', new Date(Date.now() - 180000).toISOString()).order('started_at')
    ]);
    if (ext.error && tm.error) return;   // migration-v32 not run yet
    wrap.style.display = 'block';
    const reqs = ext.data || [];
    document.getElementById('extCount').textContent = reqs.length ? `· ${reqs.length} request${reqs.length === 1 ? '' : 's'} for more time` : '';
    document.getElementById('extList').innerHTML = reqs.length ? reqs.map(r => `
      <div class="portal-project-card" style="padding:12px 14px; margin-bottom:8px;">
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <div style="flex:1; min-width:220px;">
            <b>${escapeHtml(r.who ? r.who.name : 'Someone')}</b> wants <a href="task.html?id=${r.task_id}" style="text-decoration:underline;">${escapeHtml(r.tasks ? r.tasks.title : 'a task')}</a> moved from <b>${dmyD(r.old_due)}</b> to <b>${dmyD(r.new_due)}</b>
            <div class="portal-note" style="margin-top:3px;">“${escapeHtml(r.reason)}”</div>
          </div>
          <button class="btn btn-secondary" style="padding:7px 14px; font-size:12.5px;" onclick="decideExt('${r.id}', false)">Decline</button>
          <button class="btn btn-primary" style="padding:7px 14px; font-size:12.5px;" onclick="decideExt('${r.id}', true)">Approve</button>
        </div></div>`).join('') : '<p class="portal-note">No requests waiting.</p>';
    const timers = tm.data || [];
    document.getElementById('workingNow').innerHTML = timers.length ? timers.map(t => {
      const mins = Math.max(0, Math.round((Date.now() - new Date(t.started_at).getTime()) / 60000));
      return `<div class="portal-note" style="padding:6px 2px; font-size:.84rem;"><span style="color:#ef4444;">●</span> <b>${escapeHtml(t.who ? t.who.name : 'Someone')}</b> — <a href="task.html?id=${t.task_id}" style="text-decoration:underline;">${escapeHtml(t.tasks ? t.tasks.title : 'a task')}</a> · ${mins >= 60 ? Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : mins + ' min'}</div>`;
    }).join('') : '<p class="portal-note">Nobody has a timer running right now.</p>';
  }
  async function decideExt(id, approve) {
    let note = null;
    if (approve) { if (!(await customConfirm('Approve this request and move the due date?', { title: 'Approve more time', confirmText: 'Approve' }))) return; }
    else { note = await customPrompt('Reason for declining (optional, the person will see it):', '', { title: 'Decline request', okText: 'Decline' }); if (note === null) return; }
    const { error } = await supabaseClient.rpc('decide_extension', { p_id: id, p_approve: approve, p_note: note });
    if (error) { showToast('error', 'Could not save', error.message); return; }
    showToast('success', approve ? 'New due date set' : 'Request declined', '');
    loadAdminPanels();
  }
  (async () => {
    const auth = await requireAuth();
    if (!auth) return;
    const { profile } = auth;

    document.getElementById('userAvatar').textContent = initials(profile.name);
    document.getElementById('userName').textContent = profile.name;
    document.getElementById('greeting').textContent = `Welcome back, ${profile.name.split(' ')[0]}`;
    if (isAdmin(profile)) { document.getElementById('teamLink').style.display = 'flex'; loadAdminPanels(); }

    let taskQuery = supabaseClient.from('tasks').select('id, status', { count: 'exact' });
    // Non-admins are already scoped by the tasks RLS policy (assigned, co-assigned or created).
    const { data: tasks } = await taskQuery;
    const total = tasks?.length || 0;
    const done = tasks?.filter(t => t.status === 'done').length || 0;
    const inProgress = tasks?.filter(t => t.status === 'in_progress').length || 0;

    document.getElementById('statCards').innerHTML = `
      <div class="portal-stat-card"><div class="portal-stat-label">${isAdmin(profile) ? 'Total Tasks' : 'Your Tasks'}</div><div class="portal-stat-value">${total}</div></div>
      <div class="portal-stat-card"><div class="portal-stat-label">In Progress</div><div class="portal-stat-value">${inProgress}</div></div>
      <div class="portal-stat-card"><div class="portal-stat-label">Completed</div><div class="portal-stat-value">${done}</div></div>
    `;

    const { data: updates, error } = await supabaseClient
      .from('task_updates')
      .select('id, update_text, old_status, new_status, kind, mentions, created_at, task_id, is_system, tasks(title, assigned_to, created_by), profiles(name)')
      .order('created_at', { ascending: false })
      .limit(20);

    const { data: roster } = await supabaseClient.from('profiles').select('id, name');

    const feed = document.getElementById('activityFeed');
    if (error) { feed.innerHTML = `<p class="portal-note">Could not load activity.</p>`; return; }

    // Employees only see their own required updates — auto-generated
    // system entries (task created, moved via Kanban, etc.) are admin-only.
    const visible = (isAdmin(profile)
      ? (updates || [])
      : (updates || []).filter(u => u.tasks && !u.is_system)
    ).slice(0, 12);

    if (!visible || visible.length === 0) {
      feed.innerHTML = `<div class="portal-empty-state"><h3>No updates yet</h3><p>Task updates will show up here as your team logs progress.</p></div>`;
      return;
    }

    feed.innerHTML = visible.map(u => {
      const isComment = u.kind === 'comment';
      const mentionedMe = (u.mentions || []).includes(profile.id);
      return `
      <div class="portal-timeline-row portal-timeline-row--${isComment ? 'sky' : timelineVariant(u.new_status)}">
        <div class="portal-timeline-icon">${isComment ? commentIcon() : timelineIcon(u.new_status)}</div>
        <div>
          <div style="font-size:.84rem;"><b>${escapeHtml(u.profiles?.name || 'Someone')}</b> ${isComment ? 'commented on' : 'on'}
            <a href="task.html?id=${u.task_id}" style="color:var(--primary); font-weight:600;">${escapeHtml(u.tasks?.title || 'a task')}</a>
            <span class="portal-note" style="margin-left:6px;">${timeAgo(u.created_at)}</span>
            ${mentionedMe ? `<span class="status-pill status-blue" style="font-size:10px; margin-left:6px;">${icon('bell', 11)} mentioned you</span>` : ''}
          </div>
          <div style="font-size:.82rem; color:var(--ink-soft); margin-top:3px;">${highlightMentions(u.update_text, roster || [])}</div>
        </div>
      </div>`;
    }).join('');
  })();
</script>
</body>
</html>
