<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Follow-Up Register — Euodoo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="css/register.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="rg-body">
<script>try{if(localStorage.getItem('euodoo-dark-mode')==='1')document.body.classList.add('dark-mode');}catch(e){}</script>

<header class="rg-header">
    <div class="rg-brand"><img src="assets/logo-mark.png" alt="" onerror="this.style.display='none'"><span class="t">Follow-Up Register</span><small>MARKETING</small></div>
    <div class="rg-spacer"></div>
    <div class="rg-user"><div class="rg-avatar" id="rgAvatar">--</div><span class="nm" id="rgName">Loading…</span></div>
    <button class="rg-iconbtn" onclick="toggleDarkMode()" title="Toggle dark mode">◐</button>
    <button class="rg-iconbtn" onclick="requestLogout()">Sign out</button>
</header>

<main class="rg-main"><div id="regMount"></div></main>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/register.js"></script>
<script>
    async function requestLogout() {
      if (RegisterApp.hasUnsaved() && !(await customConfirm('You have unsaved changes that will be lost. Sign out anyway?', { confirmText: 'Sign out', danger: true }))) return;
      logout();
    }
    (async () => {
      const auth = await requireAuth({ register: true, standalone: true });
      if (!auth) return;
      if (auth.profile.role === 'admin') { window.location.replace('register-admin.html'); return; }
      document.getElementById('rgName').textContent = auth.profile.name;
      document.getElementById('rgAvatar').textContent = initials(auth.profile.name);
      RegisterApp.init({ admin: false, profile: auth.profile, mountId: 'regMount' });
    })();
</script>
</body>
</html>
