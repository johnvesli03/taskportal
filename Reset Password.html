<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Euodoo Task Portal</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/portal.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="portal-page">

<div class="portal-auth-section" style="max-width:420px; margin:0 auto;">
    <div class="portal-auth-card">
        <div style="display:flex; justify-content:center; margin-bottom:16px;">
            <img src="assets/logo.png" alt="Euodoo Technologies" style="height:40px;" onerror="this.style.display='none'">
        </div>
        <div class="section-tag">Euodoo Technologies</div>
        <h1>Set a New Password</h1>
        <p class="portal-auth-desc">Choose a new password for your Task Portal account.</p>

        <div class="portal-error" id="authError"></div>
        <div id="formArea">
            <p class="portal-note" style="text-align:center; padding:20px 0;">Verifying your reset link...</p>
        </div>
    </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    const errorBox = document.getElementById('authError');
    const formArea = document.getElementById('formArea');

    function showForm() {
      formArea.innerHTML = `
        <form id="resetForm">
          <div class="portal-field">
            <label>New Password</label>
            <input type="password" class="input-box" id="p1" placeholder="At least 6 characters" required minlength="6">
          </div>
          <div class="portal-field">
            <label>Confirm New Password</label>
            <input type="password" class="input-box" id="p2" placeholder="Repeat password" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Update Password</button>
        </form>`;

      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';
        const p1 = document.getElementById('p1').value;
        const p2 = document.getElementById('p2').value;
        if (p1 !== p2) {
          errorBox.style.display = 'block';
          errorBox.textContent = "Passwords don't match.";
          return;
        }
        const { error } = await supabaseClient.auth.updateUser({ password: p1 });
        if (error) {
          errorBox.style.display = 'block';
          errorBox.textContent = error.message;
          return;
        }
        formArea.innerHTML = `<p style="font-size:.86rem; color:#166534; background:#f0fdf4; border:1px solid #bbf7d0; padding:12px 14px; border-radius:8px; text-align:center;">Password updated. Redirecting to sign in...</p>`;
        await supabaseClient.auth.signOut();
        setTimeout(() => { window.location.href = 'index.html'; }, 1800);
      });
    }

    (async () => {
      // Supabase JS auto-parses the recovery token from the URL and creates
      // a temporary session — we just need to wait for that to happen.
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) { showForm(); return; }

      supabaseClient.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') showForm();
      });

      setTimeout(async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) { showForm(); }
        else {
          formArea.innerHTML = `<p class="portal-note" style="text-align:center; padding:10px 0;">This reset link is invalid or has expired.</p><a href="index.html" class="btn btn-secondary" style="width:100%; justify-content:center; display:flex; margin-top:10px;">Back to Sign In</a>`;
        }
      }, 2500);
    })();
</script>
</body>
</html>
