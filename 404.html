<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Task Not Found | Euodoo Task Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <style>
        :root {
          --primary: #F06422;
          --primary-dark: #C8500F;
          --accent-teal: #0FB9AE;
          --navy: #1a1852;
          --navy-deep: #110f3a;
          --ink: #eef1f8;
          --ink-soft: #b7bedb;
          --ink-muted: #8b91b8;
        }
        * { box-sizing: border-box; }
        html, body {
          margin: 0; height: 100%;
          font-family: 'Inter', 'Segoe UI', sans-serif;
          background: radial-gradient(ellipse 120% 80% at 50% -10%, #241f6e 0%, var(--navy) 45%, var(--navy-deep) 100%);
          color: var(--ink);
          overflow: hidden;
        }
        .stage {
          position: relative;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 24px;
          text-align: center;
        }

        /* drifting background particles — little "task dust" */
        .particle {
          position: absolute;
          border-radius: 50%;
          background: rgba(240, 100, 34, 0.35);
          animation: drift linear infinite;
        }
        @keyframes drift {
          from { transform: translateY(110vh) translateX(0) scale(1); opacity: 0; }
          8% { opacity: 1; }
          92% { opacity: 1; }
          to { transform: translateY(-10vh) translateX(var(--dx, 40px)) scale(0.4); opacity: 0; }
        }

        /* floating kanban card that drifted off-board */
        .lost-card {
          position: relative;
          width: 230px;
          background: #22205f;
          border: 1px solid rgba(255,255,255,0.08);
          border-radius: 14px;
          padding: 16px 18px;
          box-shadow: 0 20px 50px rgba(0,0,0,0.45), 0 0 0 1px rgba(240,100,34,0.08);
          text-align: left;
          animation: float 4.5s ease-in-out infinite;
          margin-bottom: 36px;
        }
        @keyframes float {
          0%, 100% { transform: translateY(0) rotate(-2.5deg); }
          50% { transform: translateY(-16px) rotate(2deg); }
        }
        .lost-card::after {
          content: '';
          position: absolute; left: 50%; bottom: -26px;
          width: 70%; height: 14px; margin-left: -35%;
          background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), transparent 70%);
          animation: shadowPulse 4.5s ease-in-out infinite;
        }
        @keyframes shadowPulse {
          0%, 100% { opacity: .55; transform: scaleX(1); }
          50% { opacity: .25; transform: scaleX(.75); }
        }
        .lost-card .tag { display:inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
          background: rgba(240,100,34,0.15); color: #ffab76; border: 1px solid rgba(240,100,34,0.3);
          padding: 3px 8px; border-radius: 999px; margin-bottom: 10px; }
        .lost-card .title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--ink); margin-bottom: 10px; }
        .lost-card .checklist div { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-muted); margin-bottom: 6px; }
        .lost-card .box { width: 13px; height: 13px; border-radius: 4px; border: 1.5px solid var(--ink-muted); flex-shrink: 0; position: relative; }
        .lost-card .checklist div:first-child .box { border-color: var(--accent-teal); background: var(--accent-teal); }
        .lost-card .checklist div:first-child .box::after { content:''; position:absolute; left:3px; top:0px; width:4px; height:8px; border:solid #0f172a; border-width:0 2px 2px 0; transform: rotate(40deg); }
        .lost-card .checklist div:nth-child(2) .box { animation: blink 1.4s steps(1) infinite; }
        @keyframes blink { 0%, 49% { border-color: var(--ink-muted); } 50%, 100% { border-color: var(--primary); } }

        .code-404 {
          font-family: 'Sora', sans-serif;
          font-weight: 800;
          font-size: clamp(64px, 14vw, 120px);
          line-height: 1;
          letter-spacing: -0.02em;
          background: linear-gradient(135deg, #ffab76 0%, var(--primary) 45%, var(--accent-teal) 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent;
          margin: 0 0 6px;
          position: relative;
        }
        .code-404 .glitch-layer {
          position: absolute; inset: 0;
          color: var(--accent-teal);
          -webkit-background-clip: initial; background-clip: initial;
          background: none;
          opacity: 0;
          animation: glitch 6s ease-in-out infinite;
          clip-path: inset(0 0 60% 0);
        }
        @keyframes glitch {
          0%, 92%, 100% { opacity: 0; transform: translate(0,0); }
          93% { opacity: .7; transform: translate(-4px, 2px); }
          94% { opacity: .5; transform: translate(4px, -1px); }
          95% { opacity: .7; transform: translate(-2px, 1px); clip-path: inset(30% 0 10% 0); }
          96% { opacity: 0; }
        }

        h1.headline { font-family: 'Sora', sans-serif; font-size: clamp(18px, 2.6vw, 24px); font-weight: 700; margin: 4px 0 8px; color: var(--ink); }
        p.sub { color: var(--ink-soft); font-size: 14.5px; max-width: 420px; margin: 0 auto 28px; line-height: 1.6; }

        .search-line {
          display: inline-flex; align-items: center; gap: 8px;
          font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ink-muted);
          background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
          padding: 8px 14px; border-radius: 999px; margin-bottom: 32px;
        }
        .search-line .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-teal); animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
        .search-line .cursor { display: inline-block; width: 7px; height: 14px; background: var(--primary); animation: caret 1s steps(1) infinite; }
        @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

        .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .btn {
          display: inline-flex; align-items: center; gap: 8px;
          padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 14px;
          text-decoration: none; transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
          font-family: 'Inter', sans-serif;
        }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 10px 24px rgba(240,100,34,0.3); }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 14px 30px rgba(240,100,34,0.4); }
        .btn-ghost { background: rgba(255,255,255,0.06); color: var(--ink-soft); border: 1px solid rgba(255,255,255,0.12); }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--ink); transform: translateY(-2px); }

        @media (max-width: 480px) {
          .lost-card { width: 190px; }
        }
    </style>
</head>
<body>
<div class="stage" id="stage">

    <div class="lost-card">
        <span class="tag">Task Portal</span>
        <div class="title">Find this page</div>
        <div class="checklist">
            <div><span class="box"></span> Checked the URL</div>
            <div><span class="box"></span> Searching dashboard...</div>
        </div>
    </div>

    <h2 class="code-404" aria-label="404">404<span class="glitch-layer" aria-hidden="true">404</span></h2>
    <h1 class="headline">This page wandered off the board.</h1>
    <p class="sub">The page, project or task you're looking for doesn't exist, was moved, or you don't have access to it. Let's get you back on track.</p>

    <div class="search-line"><span class="dot"></span> searching for a match<span class="cursor"></span></div>

    <div class="actions">
        <a href="dashboard.html" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Back to Dashboard
        </a>
        <a href="index.html" class="btn btn-ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign in
        </a>
    </div>
</div>

<script>
    // Scatter a handful of drifting particles behind everything, randomized each load.
    (function () {
      const stage = document.getElementById('stage');
      const count = window.innerWidth < 600 ? 10 : 18;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 3 + Math.random() * 5;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
        const duration = 9 + Math.random() * 10;
        p.style.animationDuration = duration + 's';
        p.style.animationDelay = (Math.random() * duration) + 's';
        if (Math.random() > 0.5) p.style.background = 'rgba(15, 185, 174, 0.3)';
        stage.appendChild(p);
      }
    })();
</script>
</body>
</html>
